spring.application.name=sga-backend
server.port=8080

# Orígenes permitidos para el servidor de desarrollo de React (Vite)
sga.cors.origenes-permitidos=http://localhost:5173,http://127.0.0.1:5173
# Cada cuántos milisegundos se revisan las reservas pendientes por vencer
sga.vencimiento.intervalo-revision-ms=15000
# Carga el escenario de demostración al iniciar
sga.datos-demo.activo=true

spring.servlet.multipart.max-file-size=2MB
spring.mvc.problemdetails.enabled=true
